<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dream Team Hub</title>
  <meta name="description" content="A collection of projects by the Dream Team.">
  <link rel="canonical" href="https://dreamteamhub.ca/">
  <!-- Icons (in favicons/; favicon.ico stays at the root, where browsers and Google look for it
       by default): PNGs for modern tabs, apple-touch-icon for
       iPhone/iPad home screens, site.webmanifest for Android home screens and installs. -->
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicons/android-chrome-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
  <link rel="manifest" href="/favicons/site.webmanifest">
  <meta name="theme-color" content="#f4f5f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121319" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4891374612985830" crossorigin="anonymous"></script>
</head>
<body>
  <header class="site-header">
    <nav class="site-nav" aria-label="Site">
      <a class="pill-link" href="https://leaderboard.dreamteamhub.ca/">Leaderboard</a>
    </nav>
    <!-- Filled in by js/account.js: "Sign in", or the player's name with a menu. -->
    <div id="account" class="account"></div>
    <h1>Dream Team Hub</h1>
    <p class="tagline">A collection of our projects</p>
  </header>
  <main>
    <a class="kofi-button" href="https://ko-fi.com/abtea" target="_blank" rel="noopener"><img src="https://storage.ko-fi.com/cdn/logomarkLogo.png" alt="" class="kofi-button__icon"><span>Support us</span></a>

    <!-- The plaza is the walk-around lobby for every game below, so it gets a banner rather than a card. -->
    <a class="plaza-banner" href="https://io.dreamteamhub.ca/">
      <div class="plaza-banner__media">
        <!-- Phones get a closer crop of the plaza so player names stay readable at that size;
             700px is where the banner stacks (see .plaza-banner in css/styles.css). -->
        <picture>
          <source media="(max-width: 700px)" srcset="images/projects/plaza-mobile.png">
          <img src="images/projects/plaza.png" alt="" decoding="async">
        </picture>
      </div>
      <div class="plaza-banner__body">
        <span class="plaza-banner__badge">New &middot; multiplayer</span>
        <h2 class="plaza-banner__title">Enter the Battlefield</h2>
        <p class="plaza-banner__text">Run around, Spam Emotes, and Make Friends!</p>
        <span class="plaza-banner__cta">Play now &rarr;</span>
      </div>
    </a>

    <section id="project-grid" class="grid" aria-label="Projects">
      <noscript><p class="empty">Please enable JavaScript to view the projects.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Dream Team Hub &middot; <a href="privacy.html">Privacy</a> &middot; <a href="contact.html">Contact</a></p>
  </footer>

  <script src="js/projects.js"></script>
  <script src="js/main.js"></script>
  <script src="js/account.js"></script>
</body>
</html>
